plugins {
    id 'java'
}

group = 'com.coaxgames.smp'
version = '2.7'
repositories {
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3-pre-2.build.0-alpha'
    testImplementation 'io.papermc.paper:paper-api:26.3-pre-2.build.0-alpha'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}

def generatedResourcePack = layout.buildDirectory.dir('generated/resource-pack')

tasks.register('generateResourcePack', Exec) {
    inputs.dir('Textures')
    inputs.file('scripts/build-resource-pack.py')
    outputs.dir(generatedResourcePack)
    workingDir = projectDir

    def python = providers.gradleProperty('pythonExecutable')
            .getOrElse(org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'python' : 'python3')
    commandLine python, 'scripts/build-resource-pack.py', 'Textures', generatedResourcePack.get().asFile
}

tasks.register('resourcePack', Zip) {
    dependsOn tasks.named('generateResourcePack')
    from(generatedResourcePack)
    archiveFileName = "galaxy-smp-resource-pack-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

tasks.register('resourcePackSha1') {
    dependsOn tasks.named('resourcePack')
    def archive = tasks.named('resourcePack').flatMap { it.archiveFile }
    inputs.file(archive)
    outputs.file(layout.buildDirectory.file("distributions/galaxy-smp-resource-pack-${project.version}.zip.sha1"))
    doLast {
        def packFile = archive.get().asFile
        def sha1File = outputs.files.singleFile
        sha1File.parentFile.mkdirs()
        sha1File.text = java.security.MessageDigest.getInstance('SHA-1')
                .digest(packFile.bytes)
                .collect { String.format('%02x', it) }
                .join() + System.lineSeparator()
    }
}

tasks.named('build') {
    dependsOn tasks.named('resourcePackSha1')
}
