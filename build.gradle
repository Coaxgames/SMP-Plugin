plugins {
    id 'java'
}

group = 'com.coaxgames.smp'
version = '2.22.7'
repositories {
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3-pre-2.build.0-alpha'
    testImplementation 'io.papermc.paper:paper-api:26.3-pre-2.build.0-alpha'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}

def generatedResourcePack = layout.buildDirectory.dir('generated/resource-pack')

tasks.register('generateResourcePack', Exec) {
    inputs.dir('Textures')
    inputs.file('scripts/build-resource-pack.py')
    outputs.dir(generatedResourcePack)
    workingDir = projectDir

    def python = providers.gradleProperty('pythonExecutable')
            .getOrElse(org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'python' : 'python3')
    commandLine python, 'scripts/build-resource-pack.py', 'Textures', generatedResourcePack.get().asFile
}

tasks.register('resourcePack', Zip) {
    dependsOn tasks.named('generateResourcePack')
    from(generatedResourcePack)
    archiveFileName = "galaxy-smp-resource-pack-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

tasks.register('resourcePackSha1') {
    dependsOn tasks.named('resourcePack')
    def archive = tasks.named('resourcePack').flatMap { it.archiveFile }
    inputs.file(archive)
    outputs.file(layout.buildDirectory.file("distributions/galaxy-smp-resource-pack-${project.version}.zip.sha1"))
    doLast {
        def packFile = archive.get().asFile
        def sha1File = outputs.files.singleFile
        sha1File.parentFile.mkdirs()
        sha1File.text = java.security.MessageDigest.getInstance('SHA-1')
                .digest(packFile.bytes)
                .collect { String.format('%02x', it) }
                .join() + System.lineSeparator()
    }
}

tasks.named('build') {
    dependsOn tasks.named('resourcePackSha1')
}

tasks.register('copyLocalBuild', Copy) {
    dependsOn tasks.named('build')
    from(layout.buildDirectory.dir('libs')) { include "*-${project.version}.jar" }
    from(layout.buildDirectory.dir('distributions')) { include "*-${project.version}.zip", "*-${project.version}.zip.sha1" }
    into layout.projectDirectory.dir('local-build')
    doFirst { delete layout.projectDirectory.dir('local-build') }
}

tasks.register('bumpVersion') {
    description = 'Increments the patch version in build.gradle and plugin.yml.'
    def gradleFile = file('build.gradle')
    def pluginFile = file('src/main/resources/plugin.yml')
    doLast {
        def gradlePattern = ~/(?m)^version\s*=\s*'(\d+)\.(\d+)\.(\d+)'/
        def pluginPattern = ~/(?m)^version:\s*'(\d+)\.(\d+)\.(\d+)'/
        def gradleText = gradleFile.getText('UTF-8')
        def pluginText = pluginFile.getText('UTF-8')
        def gradleMatch = gradleText =~ gradlePattern
        def pluginMatch = pluginText =~ pluginPattern
        if (!gradleMatch.find() || !pluginMatch.find()) {
            throw new GradleException('Could not find major.minor.patch versions in build.gradle and plugin.yml')
        }
        def current = [gradleMatch, pluginMatch].collect { m -> [m.group(1), m.group(2), m.group(3)]*.toInteger() }
        def highest = current.max { a, b -> a[0] <=> b[0] ?: a[1] <=> b[1] ?: a[2] <=> b[2] }
        def next = "${highest[0]}.${highest[1]}.${highest[2] + 1}"
        gradleFile.setText(gradleText.replaceFirst(gradlePattern, "version = '${next}'"), 'UTF-8')
        pluginFile.setText(pluginText.replaceFirst(pluginPattern, "version: '${next}'"), 'UTF-8')
        println "Version bumped to ${next}"
    }
}

// Runs in a fresh Gradle process so the build sees the bumped version.
tasks.register('buildLocal', Exec) {
    group = 'build'
    description = 'Bumps the patch version, builds the plugin jar and resource pack zip, and copies them to local-build/ (git-ignored).'
    dependsOn tasks.named('bumpVersion')
    workingDir = projectDir
    def gradlew = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'gradlew.bat' : './gradlew'
    commandLine gradlew, 'copyLocalBuild', '--console=plain'
}
