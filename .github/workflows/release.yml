name: Build and release

on:
  workflow_run:
    workflows: ["Main branch build"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: galaxy-release-main
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      startsWith(github.event.workflow_run.path, '.github/workflows/main-build.yml') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - name: Check owner or merged pull request approvals
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const isAdmin = async (username) => {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo,
                  username,
                });
                return data.permission === "admin";
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            };

            const headSha = context.payload.workflow_run.head_sha;
            const { data: mainBranch } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: "main",
            });
            if (mainBranch.commit.sha !== headSha) {
              core.info("A newer main commit is already present; its build run will handle the release.");
              core.setOutput("authorized", "false");
              return;
            }

            const { data: associatedPullRequests } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: headSha,
              });
            const pullRequest = associatedPullRequests.find((candidate) => candidate.merged_at);
            const run = context.payload.workflow_run;
            if (
              !pullRequest &&
              run.actor.login.endsWith("[bot]") &&
              (run.head_commit?.message ?? "").startsWith("chore: release ")
            ) {
              core.info("Automated release version commit; nothing more to release.");
              core.setOutput("authorized", "false");
              return;
            }
            if (!pullRequest) {
              throw new Error(
                "Direct pushes to main are not allowed for anyone. Push a branch and merge the pull request instead.",
              );
            }
            const actorIsAdmin = await isAdmin(context.payload.workflow_run.actor.login);

            core.setOutput("authorized", "true");
            if (actorIsAdmin) return;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const latestReviewByUser = new Map();
            for (const review of reviews) {
              if (!review.user || !review.submitted_at || review.state === "COMMENTED") continue;
              const previous = latestReviewByUser.get(review.user.login);
              if (!previous || new Date(review.submitted_at) > new Date(previous.submitted_at)) {
                latestReviewByUser.set(review.user.login, review);
              }
            }
            const approvals = [...latestReviewByUser.entries()].filter(([login, review]) =>
              login !== pullRequest.user.login &&
              review.state === "APPROVED" &&
              review.commit_id === pullRequest.head.sha
            );
            let adminApproval = false;
            for (const [login] of approvals) {
              if (await isAdmin(login)) {
                adminApproval = true;
                break;
              }
            }
            if (!adminApproval && approvals.length < 2) {
              throw new Error(`Merged PR #${pullRequest.number} needs 2 current approvals or 1 admin approval.`);
            }

  build-release:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Check out main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Set release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAGS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[].name')"
          SOURCE_ROOT="$GITHUB_WORKSPACE/source" RELEASE_TAGS="$RELEASE_TAGS" \
            node trusted/scripts/release-version.mjs

      - name: Build plugin
        working-directory: source
        run: bash gradlew clean build

      - name: Verify release jar
        working-directory: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "build/libs/galaxy-smp-plugin-${VERSION}.jar"
          test -f "build/distributions/galaxy-smp-resource-pack-${VERSION}.zip"
          test -f "build/distributions/galaxy-smp-resource-pack-${VERSION}.zip.sha1"

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Commit version to main
        id: publish-commit
        working-directory: source
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          RELEASE_SHA="$HEAD_SHA"
          if ! git diff --quiet -- build.gradle src/main/resources/plugin.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build.gradle src/main/resources/plugin.yml
            git commit -m "chore: release $VERSION"
            if git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main; then
              RELEASE_SHA="$(git rev-parse HEAD)"
            else
              echo "::warning::main moved during the release; releasing the built commit without a version commit. The next release continues from the tags."
            fi
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.publish-commit.outputs.release_sha }}
        run: |
          gh release create "$VERSION" \
            "build/libs/galaxy-smp-plugin-${VERSION}.jar" \
            "build/distributions/galaxy-smp-resource-pack-${VERSION}.zip" \
            "build/distributions/galaxy-smp-resource-pack-${VERSION}.zip.sha1" \
            --title "$VERSION" \
            --generate-notes \
            --target "$RELEASE_SHA"
