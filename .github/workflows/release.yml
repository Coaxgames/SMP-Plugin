name: Build and release

on:
  workflow_run:
    workflows: ["Main branch build"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: galaxy-release-main
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      startsWith(github.event.workflow_run.path, '.github/workflows/main-build.yml') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      pre_bumped: ${{ steps.gate.outputs.pre_bumped }}
    steps:
      - name: Check owner or merged pull request approvals
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const isAdmin = async (username) => {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo,
                  username,
                });
                return data.permission === "admin";
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            };

            const headSha = context.payload.workflow_run.head_sha;
            const { data: mainBranch } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: "main",
            });
            if (mainBranch.commit.sha !== headSha) {
              core.info("A newer main commit is already present; its build run will handle the release.");
              core.setOutput("authorized", "false");
              core.setOutput("pre_bumped", "false");
              return;
            }

            const { data: associatedPullRequests } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: headSha,
              });
            const pullRequest = associatedPullRequests.find((candidate) => candidate.merged_at);
            const actorIsAdmin = await isAdmin(context.payload.workflow_run.actor.login);
            if (!actorIsAdmin && !pullRequest) {
              throw new Error("Non-admin pushes to main must come from a merged, approved pull request.");
            }

            core.setOutput("authorized", "true");
            core.setOutput("pre_bumped", "false");
            if (!pullRequest) return;

            const { data: changedFiles } = await github.rest.pulls.listFiles({
              ...context.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const changedPaths = new Set(changedFiles.map((file) => file.filename));
            const preBumped =
              changedPaths.has("build.gradle") &&
              changedPaths.has("src/main/resources/plugin.yml");
            core.setOutput("pre_bumped", String(preBumped));
            if (actorIsAdmin) return;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const latestReviewByUser = new Map();
            for (const review of reviews) {
              if (!review.user || !review.submitted_at || review.state === "COMMENTED") continue;
              const previous = latestReviewByUser.get(review.user.login);
              if (!previous || new Date(review.submitted_at) > new Date(previous.submitted_at)) {
                latestReviewByUser.set(review.user.login, review);
              }
            }
            const approvals = [...latestReviewByUser.entries()].filter(([login, review]) =>
              login !== pullRequest.user.login &&
              review.state === "APPROVED" &&
              review.commit_id === pullRequest.head.sha
            );
            let adminApproval = false;
            for (const [login] of approvals) {
              if (await isAdmin(login)) {
                adminApproval = true;
                break;
              }
            }
            if (!adminApproval && approvals.length < 2) {
              throw new Error(`Merged PR #${pullRequest.number} needs 2 current approvals or 1 admin approval.`);
            }

  build-release:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Check out main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Set release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PREBUMPED: ${{ needs.authorize.outputs.pre_bumped }}
        run: |
          RELEASE_TAGS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[].name')"
          PREBUMPED="$PREBUMPED"
          if git -C source log --format=%s --grep='^chore: release ' -n 1 | grep -q .; then
            PREBUMPED=true
          fi
          SOURCE_ROOT="$GITHUB_WORKSPACE/source" RELEASE_TAGS="$RELEASE_TAGS" PREBUMPED="$PREBUMPED" \
            node trusted/scripts/release-version.mjs

      - name: Build plugin
        working-directory: source
        run: bash gradlew clean build

      - name: Verify release jar
        working-directory: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test -f "build/libs/galaxy-smp-plugin-${VERSION}.jar"

      - name: Commit version and push it to main
        id: publish-commit
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- build.gradle src/main/resources/plugin.yml; then
            git add build.gradle src/main/resources/plugin.yml
            git commit -m "chore: release $VERSION"
            gh auth setup-git
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.publish-commit.outputs.release_sha }}
        run: |
          gh release create "$VERSION" "build/libs/galaxy-smp-plugin-${VERSION}.jar" \
            --title "$VERSION" \
            --generate-notes \
            --target "$RELEASE_SHA"
