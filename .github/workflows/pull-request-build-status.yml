name: Build and report pull request

on:
  workflow_run:
    workflows: ["Pull request build signal"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    if: startsWith(github.event.workflow_run.path, '.github/workflows/pull-request-build.yml')
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Find pull request head commit
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let pullRequest = (run.pull_requests ?? []).find((candidate) => candidate.head?.sha);
            if (!pullRequest) {
              const { data: associated } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  ...context.repo,
                  commit_sha: run.head_sha,
                });
              pullRequest = associated.find((candidate) => candidate.state === "open");
            }
            if (!pullRequest?.head?.sha) {
              core.warning("No open pull request is associated with this build signal.");
              return;
            }
            core.setOutput("head_sha", pullRequest.head.sha);

  build:
    needs: prepare
    if: needs.prepare.outputs.head_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request code without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build plugin
        run: bash gradlew build

  report:
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.head_sha != ''
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report trusted build result
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        with:
          script: |
            const succeeded = process.env.BUILD_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: succeeded ? "success" : "failure",
              context: "galaxy/build",
              description: succeeded ? "Plugin build passed." : "Plugin build failed.",
            });
