name: Prepare contributor pull request

on:
  workflow_run:
    workflows: ["Contributor push signal"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.path, '.github/workflows/contributor-push.yml') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.prepare.outputs.head_sha }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Check out pushed source without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
          persist-credentials: false

      - name: Bump version on pushed branch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ || "$BRANCH" == "main" ]]; then
            echo "Unexpected branch name: $BRANCH" >&2
            exit 1
          fi
          RELEASE_TAGS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[].name')"
          PREBUMPED=false
          if git -C source log --format=%s --grep='^chore: bump plugin version to ' -n 1 | grep -q . ||
            git -C source log --format=%s --grep='^chore: release ' -n 1 | grep -q .; then
            PREBUMPED=true
          fi
          SOURCE_ROOT="$GITHUB_WORKSPACE/source" RELEASE_TAGS="$RELEASE_TAGS" PREBUMPED="$PREBUMPED" \
            node trusted/scripts/release-version.mjs
          VERSION="$(sed -n 's/^version=//p' "$GITHUB_OUTPUT")"
          if ! git -C source diff --quiet -- build.gradle src/main/resources/plugin.yml; then
            git -C source config user.name "github-actions[bot]"
            git -C source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C source add build.gradle src/main/resources/plugin.yml
            git -C source commit -m "chore: bump plugin version to $VERSION"
            gh auth setup-git
            git -C source push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "head_sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
        with:
          script: |
            const base = context.payload.repository.default_branch;
            const branch = context.payload.workflow_run.head_branch;
            const head = `${context.repo.owner}:${branch}`;
            const existing = await github.rest.pulls.list({
              ...context.repo,
              state: "open",
              base,
              head,
              per_page: 1,
            });
            let pullRequest;
            if (existing.data.length > 0) {
              pullRequest = existing.data[0];
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: pullRequest.number,
                title: `Plugin update: ${branch}`,
                body: "Automated PR for a non-admin branch push. The release version is bumped in this branch.",
              });
            } else {
              const { data } = await github.rest.pulls.create({
                ...context.repo,
                title: `Plugin update: ${branch}`,
                head,
                base,
                body: "Automated PR for a non-admin branch push. The release version is bumped in this branch.",
              });
              pullRequest = data;
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: "pending",
              context: "galaxy/build",
              description: "Waiting for the contributor build.",
            });

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out prepared branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build plugin
        run: bash gradlew build

  report-build:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report contributor build status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        with:
          script: |
            const succeeded = process.env.BUILD_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: succeeded ? "success" : "failure",
              context: "galaxy/build",
              description: succeeded ? "Plugin build passed." : "Plugin build failed.",
            });
