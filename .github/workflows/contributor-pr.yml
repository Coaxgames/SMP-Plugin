name: Prepare contributor pull request

on:
  workflow_run:
    workflows: ["Contributor push signal"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.path, '.github/workflows/contributor-push.yml') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Create or update pull request
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const base = context.payload.repository.default_branch;
            const branch = context.payload.workflow_run.head_branch;
            const head = `${context.repo.owner}:${branch}`;
            const existing = await github.rest.pulls.list({
              ...context.repo,
              state: "open",
              base,
              head,
              per_page: 1,
            });
            let pullRequest;
            if (existing.data.length > 0) {
              pullRequest = existing.data[0];
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: pullRequest.number,
                title: `Plugin update: ${branch}`,
                body: "Automated PR for a branch push. The release version is calculated automatically when this PR is merged.",
              });
            } else {
              const { data } = await github.rest.pulls.create({
                ...context.repo,
                title: `Plugin update: ${branch}`,
                head,
                base,
                body: "Automated PR for a branch push. The release version is calculated automatically when this PR is merged.",
              });
              pullRequest = data;
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: "pending",
              context: "galaxy/build",
              description: "Waiting for the contributor build.",
            });

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out prepared branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build plugin
        run: bash gradlew build

  report-build:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report contributor build status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        with:
          script: |
            const succeeded = process.env.BUILD_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: succeeded ? "success" : "failure",
              context: "galaxy/build",
              description: succeeded ? "Plugin build passed." : "Plugin build failed.",
            });
