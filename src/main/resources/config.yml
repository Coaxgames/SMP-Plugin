example-message: "Hello, world!"

cooldowns:
  default-seconds: 0
  star_mace: 30
  collapsing_star_mace: 30
  nebula_spear: 45
  nova_shield: 600

phase-four:
  combo-window-seconds: 3
  daily-trigger-tick: 13500
  daily-effect-seconds: 300
  astral-sword:
    attack-speed-seconds: 30
  kuiper-ball:
    freeze-seconds: 30
    burst-radius: 4.0
    burst-strength: 1.5
  mass-orb:
    passive-refresh-ticks: 40
    # Provisional height-scaled damage: max(0, fall-distance - 3) * damage-per-block,
    # capped at maximum-damage, then reduced by the configured Feather Falling XV placeholder.
    # Damage is in Minecraft health points.
    free-fall-distance: 3.0
    damage-per-block: 1.0
    maximum-damage: 40.0
    feather-falling-level: 15
    feather-falling-reduction-per-level: 0.12
    maximum-feather-falling-reduction: 0.8
  lunar-leggings:
    # False means wait for the next daily trigger after a missed offline trigger.
    catch-up-if-offline: false

phase-five:
  # Damage limits use health points converted from hearts.
  mace-damage-cap-hearts: 7.0
  collapsing-star-mace:
    # Provisional spark count and radius; owner balance decisions remain open.
    spark-count-per-hit: 1
    spark-radius: 1.5
    # One heart per spark maximum; configurable below that limit.
    spark-damage: 2.0
  nebula-spear:
    # Provisional impulse and hitbox around the successful fifth lunge.
    thrust-velocity: 2.5
    thrust-radius: 2.5
    thrust-damage-hearts: 4.0
  wormhole-trident:
    # The radius is intentionally provisional pending owner confirmation.
    interaction-radius: 2.0
    creator-launch-distance: 20
    lifetime-after-passage-seconds: 50
    opponent-damage-hearts: 2.0
    opponent-wither-seconds: 20
  celestial-bow:
    # Cloud effect and splash values are provisional until balance review.
    cloud-effect: WITHER
    cloud-radius: 3.0
    cloud-duration-seconds: 10
    cloud-effect-seconds: 5
    cloud-effect-amplifier: 0
    splash-radius: 4.0
    splash-damage: 2.0
  cosmic-crown:
    # Provisional direct-attacker target and retaliation damage pending owner review.
    thorns-damage: 2.0
  singularity-boots:
    explosion-fall-distance: 50
    # Galaxy cloud particles: 0 disables them, 100 is the default amount, 200 doubles it.
    # Applies to both the worn effect and the explosion cloud.
    particle-percent: 100
  nova-shield:
    # Shield disable period is provisional pending balance review.
    disable-seconds: 5

rituals:
  duration-seconds: 180
  reveal-interval-seconds: 180
  # Audience is global; customize the remaining announcement format here.
  reveal-message: "{item} crafted by {crafter} at ({x}, {y}, {z})"

legendary-items:
  # Edit each item's text and two hex colors to customize its name gradient.
  display-names:
    nebula_spear:
      text: "Nebula Spear"
      start-color: "#3A1C71"
      end-color: "#D76D77"
    star_mace:
      text: "Star Mace"
      start-color: "#F7971E"
      end-color: "#FFD200"
    collapsing_star_mace:
      text: "Collapsing Star Mace"
      start-color: "#CB2D3E"
      end-color: "#EF473A"
    astral_sword:
      text: "Astral Sword"
      start-color: "#4568DC"
      end-color: "#B06AB3"
    void_sword:
      text: "Void Sword"
      start-color: "#232526"
      end-color: "#6D214F"
    celestial_bow:
      text: "Celestial Bow"
      start-color: "#00B4DB"
      end-color: "#0083B0"
    wormhole_trident:
      text: "Wormhole Trident"
      start-color: "#654EA3"
      end-color: "#EAafc8"
    cosmic_crown:
      text: "Cosmic Crown"
      start-color: "#FBD786"
      end-color: "#F7797D"
    singularity_boots:
      text: "Singularity Boots"
      start-color: "#373B44"
      end-color: "#4286F4"
    solstice_chestplate:
      text: "Solstice Chestplate"
      start-color: "#F2994A"
      end-color: "#F2C94C"
    lunar_leggings:
      text: "Lunar Leggings"
      start-color: "#4568DC"
      end-color: "#C4E0E5"
    nova_shield:
      text: "Nova Shield"
      start-color: "#11998E"
      end-color: "#38EF7D"
    galaxy_string:
      text: "Galaxy String"
      start-color: "#8E2DE2"
      end-color: "#4A00E0"
    kuiper_ball:
      text: "Kuiper Ball"
      start-color: "#2980B9"
      end-color: "#6DD5FA"
    mass_orb:
      text: "Mass Orb"
      start-color: "#434343"
      end-color: "#A8A8A8"
  max-per-player:
    default: 1
    # Zero disables the per-item limit.
    items:
      galaxy_string: 0
      kuiper_ball: 0
      mass_orb: 0
      # Example: allow two Astral Swords per player.
      # astral_sword: 2
