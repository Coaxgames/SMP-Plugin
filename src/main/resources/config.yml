example-message: "Hello, world!"

# Sends the latest release's pack when compatible, otherwise the installed plugin version's pack.
# Leave resource-pack and resource-pack-sha1 blank in server.properties when this is enabled.
resource-pack:
  enabled: true
  repository: "Coaxgames/SMP-Plugin"
  check-interval-minutes: 5
  required: true
  prompt: "Galaxy SMP needs its resource pack to show custom items."

# When a newer plugin version exists, the plugin downloads its jar into the server's update folder,
# announces a countdown, then runs restart-command (the host's /restart; a leading slash is optional).
update:
  enabled: true
  check-interval-minutes: 5
  restart-delay-minutes: 10
  restart-command: "restart"

cooldowns:
  default-seconds: 0
  star_mace: 30
  collapsing_star_mace: 30
  # Starts when the held Mass Orb attempts a fall-slam.
  mass_orb: 20
  nebula_spear: 45
  nova_shield: 600

phase-four:
  # Astral Sword's hit-combo window; Void Sword hits do not expire.
  combo-window-seconds: 3
  # Lunar Leggings retain this legacy setting, including on existing servers.
  daily-trigger-tick: 13500
  solstice-chestplate:
    trigger-tick: 6000
  daily-effect-seconds: 300
  astral-sword:
    attack-speed-seconds: 30
  # Kuiper Ball ability controls. Values are read from the plugin config at runtime.
  # Edit these values on the server, then reload/restart the plugin for changes to take effect.
  kuiper-ball:
    # Freeze duration for the directly hit player or mob.
    freeze-seconds: 30
    # Burst reach in blocks and outward velocity multiplier.
    burst-radius: 4.0
    burst-strength: 1.5
    # Cooldown starts when a Kuiper Ball throw is attempted.
    cooldown-millis: 1500
    # Entity categories affected by the burst; items/projectiles are off by default.
    target-players: true
    target-mobs: true
    target-items: false
    target-projectiles: false
    # Vertical impulse added to the normalized outward direction and its minimum Y component.
    burst-vertical-boost: 0.35
    burst-minimum-vertical: 0.35
  mass-orb:
    passive-refresh-ticks: 40
    # Holder fall damage: max(0, fall-distance - 3) * damage-per-block,
    # capped at maximum-damage, then reduced by the configured Feather Falling XV placeholder.
    # Damage is in Minecraft health points. Enemy slam damage is separate: 0.5 points
    # per block fallen, up to 20 points, when the holder falls onto an entity.
    free-fall-distance: 3.0
    damage-per-block: 1.0
    maximum-damage: 40.0
    feather-falling-level: 15
    feather-falling-reduction-per-level: 0.12
    maximum-feather-falling-reduction: 0.8
  lunar-leggings:
    # False means wait for the next daily trigger after a missed offline trigger.
    catch-up-if-offline: false

phase-five:
  # Damage limits use health points converted from hearts.
  mace-damage-cap-hearts: 7.0
  collapsing-star-mace:
    # Each full heart dealt by the mace creates one spark; each spark deals 1 health point.
    # Consecutive mace hits add one additional spark per hit in the streak.
    spark-radius: 1.5
  nebula-spear:
    # Provisional impulse and hitbox around the successful fifth lunge.
    thrust-velocity: 2.5
    thrust-radius: 2.5
    thrust-damage-hearts: 4.0
  wormhole-trident:
    # The radius is intentionally provisional pending owner confirmation.
    interaction-radius: 2.0
    # Exit distance and lifetime retain their existing config keys for upgrades.
    # The exit is placed when the rifts open; the lifetime starts at that time.
    creator-launch-distance: 20
    lifetime-after-passage-seconds: 50
    opponent-damage-hearts: 2.0
    opponent-wither-seconds: 20
  celestial-bow:
    # Cloud effect, lifetime and effect strength are provisional until Phase 6 balance review.
    cloud-effect: WITHER
    cloud-radius: 3.0
    cloud-duration-seconds: 20
    cloud-effect-seconds: 5
    cloud-effect-amplifier: 0
    splash-radius: 4.0
    splash-damage: 2.0
  cosmic-crown:
    # Provisional direct-attacker target and retaliation damage pending owner review.
    thorns-damage: 2.0
  singularity-boots:
    explosion-fall-distance: 50
    # Galaxy cloud particles: 0 disables them, 100 is the default amount, 200 doubles it.
    # Applies to both the worn effect and the explosion cloud.
    particle-percent: 100
rituals:
  duration-seconds: 180
  reveal-interval-seconds: 180
  # Audience is global; customize the remaining announcement format here.
  reveal-message: "{item} crafted by {crafter} at ({x}, {y}, {z})"

legendary-items:
  # Edit each item's text and two hex colors to customize its name gradient.
  display-names:
    nebula_spear:
      text: "Nebula Spear"
      start-color: "#3A1C71"
      end-color: "#D76D77"
    star_mace:
      text: "Star Mace"
      start-color: "#F7971E"
      end-color: "#FFD200"
    collapsing_star_mace:
      text: "Collapsing Star Mace"
      start-color: "#CB2D3E"
      end-color: "#EF473A"
    astral_sword:
      text: "Astral Sword"
      start-color: "#4568DC"
      end-color: "#B06AB3"
    void_sword:
      text: "Void Sword"
      start-color: "#232526"
      end-color: "#6D214F"
    celestial_bow:
      text: "Celestial Bow"
      start-color: "#00B4DB"
      end-color: "#0083B0"
    wormhole_trident:
      text: "Wormhole Trident"
      start-color: "#654EA3"
      end-color: "#EAafc8"
    cosmic_crown:
      text: "Cosmic Crown"
      start-color: "#FBD786"
      end-color: "#F7797D"
    singularity_boots:
      text: "Singularity Boots"
      start-color: "#373B44"
      end-color: "#4286F4"
    solstice_chestplate:
      text: "Solstice Chestplate"
      start-color: "#F2994A"
      end-color: "#F2C94C"
    lunar_leggings:
      text: "Lunar Leggings"
      start-color: "#4568DC"
      end-color: "#C4E0E5"
    nova_shield:
      text: "Nova Shield"
      start-color: "#11998E"
      end-color: "#38EF7D"
    galaxy_string:
      text: "Galaxy String"
      start-color: "#8E2DE2"
      end-color: "#4A00E0"
    kuiper_ball:
      text: "Kuiper Ball"
      start-color: "#2980B9"
      end-color: "#6DD5FA"
    mass_orb:
      text: "Mass Orb"
      start-color: "#434343"
      end-color: "#A8A8A8"
    corrupt_ender_pearl:
      text: "Corrupt Ender Pearl"
      start-color: "#54276B"
      end-color: "#9E63C7"
  max-per-player:
    # Legacy settings retained for config compatibility; the active limit is two
    # legendary items total for non-operators. Usables and operators are exempt.
    default: 1
    items:
      galaxy_string: 0
      kuiper_ball: 0
      mass_orb: 0
      corrupt_ender_pearl: 0
