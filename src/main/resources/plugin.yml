name: GalaxySMP
version: '0.1.5'
main: com.coaxgames.smp.GalaxySmpPlugin
api-version: '26.3'
description: Galaxy SMP legendary items, recipes, and protection rules.
depend:
  - HeadDrop
commands:
  galaxy:
    description: Manage Galaxy SMP legendary items.
    usage: /galaxy <give|reset|list|locate>
    permission: galaxy.admin
permissions:
  galaxy.admin:
    description: Allows administering Galaxy SMP legendary items.
    default: op
